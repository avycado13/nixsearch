description = "a tui for searching nixpkgs"
repository = "https://github.com/avycado13/nixsearch"
license = "MIT"


[dependencies]
arboard = "3.6.1"
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
textwrap = "0.16.2"
